name: iOS Xcode Build (Simulator, no signing)

# Purpose: prove the existing Capacitor iOS project actually compiles on a
# real macOS/Xcode toolchain. Builds for the Simulator SDK only — no
# Apple Developer account, signing, or real device needed for this. Does
# NOT run on a physical iPad, does NOT touch a printer/cash drawer, does
# NOT do anything App Store/TestFlight related. See docs/windows-complete-
# mac-required.md and docs/ios-xcode-guide.md for the full context this
# workflow exists to unblock.

on:
  workflow_dispatch: {}
  push:
    paths:
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment (macOS / Xcode / Swift versions)
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: npm ci
        run: npm ci

      - name: npx cap sync ios
        run: npx cap sync ios

      - name: List available schemes (diagnostic — confirms the real scheme name)
        run: xcodebuild -list -project ios/App/App.xcodeproj

      - name: Resolve Swift Package Manager dependencies
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            | tee spm-resolve.log

      - name: Build for iOS Simulator (no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Verify the native bridge files were actually compiled
        # A file can exist on disk without being registered in
        # project.pbxproj's target — Xcode then silently skips it and the
        # build still succeeds. This step failed once for real (both files
        # were missing from the project) before being added to the target;
        # keeping it here so that regression can't reappear silently.
        run: |
          grep -q "MainViewController.swift" xcodebuild.log
          grep -q "PrinterTransport.swift" xcodebuild.log
          grep -q "NetworkPrinterTransport.swift" xcodebuild.log
          grep -q "PrinterManager.swift" xcodebuild.log

      - name: Boot an iOS Simulator
        # Picks whatever iPad simulator this runner's Xcode image already
        # has provisioned (falls back to any iOS device) rather than
        # hardcoding a device-type/runtime identifier this environment
        # can't confirm in advance — those strings vary by Xcode version
        # and this environment has no way to check them ahead of time.
        run: |
          set -o pipefail
          xcrun simctl list devices available
          SIM_UDID=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable == true)] as $all
            | (($all | map(select(.name | contains("iPad")))) + $all)[0].udid // empty
          ')
          if [ -z "$SIM_UDID" ]; then
            echo "No available iOS simulator found on this runner — cannot proceed with the Simulator smoke test."
            exit 1
          fi
          echo "Selected simulator UDID: $SIM_UDID"
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Install and launch the app on the Simulator
        run: |
          set -o pipefail
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -path "*iphonesimulator*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not find a built App.app for the simulator — the build step above should have produced one."
            exit 1
          fi
          echo "APP_PATH=$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "Resolved bundle id: $BUNDLE_ID"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          # Generous wait: cold Simulator boot + real network fetch of the
          # live rakeenapp.com/pos page + JS boot (Supabase client, script
          # load, service worker registration) all happen before anything
          # meaningful renders — this is genuinely fetching over the real
          # internet from a GitHub-hosted runner, not a local/mocked page.
          sleep 20

      - name: Check the app didn't crash, capture its system log
        run: |
          xcrun simctl spawn "$SIM_UDID" log show --style compact --last 60s \
            --predicate 'process == "App"' > app-sim.log || true
          tail -100 app-sim.log || true
          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
          if ls "$CRASH_DIR"/App_*.ips >/dev/null 2>&1; then
            echo "::error::A crash report was found for the App process — see uploaded artifacts."
            cp "$CRASH_DIR"/App_*.ips . || true
            exit 1
          fi
          RUNNING=$(xcrun simctl spawn "$SIM_UDID" launchctl list | grep "$BUNDLE_ID" || true)
          if [ -z "$RUNNING" ]; then
            echo "::error::App process is not listed as running after launch — it likely crashed or exited immediately."
            exit 1
          fi
          echo "App is running, no crash report found."

      - name: Screenshot the running app
        if: always()
        run: xcrun simctl io "$SIM_UDID" screenshot sim-screenshot.png || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            spm-resolve.log
            xcodebuild.log
            app-sim.log
            sim-screenshot.png
            App_*.ips
