<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>فحص الخطوط</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'TajawalRx'; src:url('/fonts/tajawal/Tajawal-Regular.ttf') format('truetype'); font-weight:400;}
@font-face{font-family:'TajawalRx'; src:url('/fonts/tajawal/Tajawal-Bold.ttf') format('truetype'); font-weight:700;}
@font-face{font-family:'RiyalTtf'; src:url('/fonts/saudi-riyal/SaudiRiyal-Regular.ttf') format('truetype'); font-weight:400;}
@font-face{font-family:'RiyalWoff'; src:url('/fonts/saudi-riyal/saudi_riyal.woff2') format('woff2'); font-weight:400;}
body{background:#111;color:#eee;font-family:monospace;padding:16px}
pre{white-space:pre-wrap;font-size:13px}
canvas{background:#fff;margin:4px;vertical-align:middle}
</style></head><body>
<pre id="log">…</pre>
<div id="strip"></div>
<script>
const RIYAL_NEW = '⃁';   // ⃁  رمز الريال الجديد
const RIYAL_OLD = '﷼';   // ﷼  الشكل التقديمي القديم
const log = [];

function widthIn(family, ch, size){
  const c = document.createElement('canvas').getContext('2d');
  c.font = '400 ' + size + 'px "' + family + '"';
  return c.measureText(ch).width;
}
/** المحرف الغائب يُرسم مربّعاً فارغاً (.notdef) أو صفراً -- ويُعرف
    بمقارنته بمحرف لا يملكه أحد قطعاً. */
function hasGlyph(family, ch){
  const probe = '￿';
  const w = widthIn(family, ch, 100);
  const wNotdef = widthIn(family, probe, 100);
  return { width: Math.round(w), notdef: Math.round(wNotdef), has: Math.abs(w - wNotdef) > 0.5 && w > 0 };
}
/** يرسم المحرف ويُعيد بصمة بكسلاته -- لكشف الانعكاس بالمقارنة. */
function render(family, ch, flip){
  const cv = document.createElement('canvas');
  cv.width = 80; cv.height = 80;
  const c = cv.getContext('2d');
  c.fillStyle='#fff'; c.fillRect(0,0,80,80);
  c.fillStyle='#000'; c.textBaseline='middle'; c.textAlign='center';
  c.font = '400 56px "' + family + '"';
  if(flip){ c.translate(80,0); c.scale(-1,1); }
  c.fillText(ch, 40, 40);
  return cv;
}
/** مركزُ ثقل الحبر أفقياً: ينتقل إذا انعكس الشكل. */
function centroid(cv){
  const d = cv.getContext('2d').getImageData(0,0,80,80).data;
  let sum=0, n=0;
  for(let y=0;y<80;y++) for(let x=0;x<80;x++){
    const i=(y*80+x)*4;
    if(d[i]<128){ sum+=x; n++; }
  }
  return n ? +(sum/n).toFixed(1) : null;
}

document.fonts.ready.then(async ()=>{
  const fams = ['IBM Plex Sans Arabic','TajawalRx','RiyalTtf','RiyalWoff'];
  const txt = 'سبانيش لاتيه 12.00';
  for(const f of fams){
    try { await document.fonts.load('400 40px "'+f+'"', txt + RIYAL_NEW + RIYAL_OLD); } catch(e){}
    try { await document.fonts.load('700 40px "'+f+'"', txt + RIYAL_NEW + RIYAL_OLD); } catch(e){}
  }
  for(const f of fams){
    const n = hasGlyph(f, RIYAL_NEW), o = hasGlyph(f, RIYAL_OLD), a = hasGlyph(f, 'س');
    log.push(f.padEnd(22) + ' U+20C1:' + (n.has?'✓':'✗') + '(' + n.width + ')'
             + '  U+FDFC:' + (o.has?'✓':'✗') + '(' + o.width + ')'
             + '  عربي:' + (a.has?'✓':'✗') + '(' + a.width + ')'
             + '  notdef=' + n.notdef);
  }
  // الانعكاس: يُقارن مركز الثقل عادياً ومقلوباً بين الخطّين.
  const strip = document.getElementById('strip');
  for(const [f,ch] of [['RiyalTtf',RIYAL_NEW],['RiyalWoff',RIYAL_NEW],['TajawalRx',RIYAL_OLD],['IBM Plex Sans Arabic',RIYAL_OLD]]){
    const a = render(f,ch,false), b = render(f,ch,true);
    log.push(f.padEnd(22)+' مركزُ الحبر: عاديّ='+centroid(a)+'  مقلوب='+centroid(b));
    const lbl=document.createElement('div'); lbl.textContent=f+' — '+ch.codePointAt(0).toString(16);
    strip.appendChild(lbl); strip.appendChild(a); strip.appendChild(b);
  }
  document.getElementById('log').textContent = log.join('\n');
});
</script></body></html>
