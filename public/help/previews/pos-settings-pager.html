<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أجهزة النداء — معاينة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700;800&display=swap">
<!-- نفس ملف ستايل لوحة التحكم الحقيقي بالإنتاج (app/dashboard/rakeen-dashboard.css) -->
<link rel="stylesheet" href="/help/previews/rakeen-dashboard.css">
<style>
  /* منسوخ حرفيًا من renderPosSettings داخل public/dashboard/rakeen-dashboard.js —
     قسم "أجهزة النداء" ضمن تبويب "أنواع الطلبات" بإعدادات الكاشير. */
  html,body{ height:auto; min-height:100%; overflow:visible; display:block; }
  body{ padding:24px; }
  .rk-page{ max-width:640px; margin-inline:auto; }
  input, button{ pointer-events:none; }
</style>
</head>
<body>

<div class="rk-page">
  <div class="settings-tabs">
    <button class="active">أنواع الطلبات</button>
    <button>الفاتورة والطباعة</button>
    <button>واجهة الكاشير</button>
    <button>شاشة المطبخ</button>
    <button>الفروع والأمان</button>
  </div>

  <div class="rk-section">
    <div class="rk-section-head">
      <div class="rk-section-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
      <div>
        <div class="rk-section-title">أجهزة النداء</div>
        <div class="rk-section-sub">الأجهزة اللي تعطيها للعميل وترن لما يجهز طلبه</div>
      </div>
    </div>
    <div class="rk-switch-row">
      <div class="rk-switch-text">
        <label class="rk-switch-label">نستخدم أجهزة نداء</label>
        <span class="rk-switch-desc">الجهاز نفسه مستقل عن الكاشير — الموظف يدخل الرقم على القاعدة بيده. الكاشير بس يسجّل أي جهاز راح مع أي طلب، ويطبعه على فاتورة المطبخ.</span>
      </div>
      <label class="rk-switch"><input type="checkbox" checked><span class="rk-switch-track"></span></label>
    </div>
    <button class="rk-btn rk-btn-secondary rk-btn-md" style="margin-top:10px;">حفظ</button>
  </div>
</div>

</body>
</html>
