<!doctype html>

<head>

<!-- نفس ملف ستايل لوحة التحكم الحقيقي بالإنتاج (app/dashboard/rakeen-dashboard.css) -->
<link rel="stylesheet" href="/help/previews/rakeen-dashboard.css">
<style>
  /* منسوخ حرفيًا من renderWaLinkPanel داخل public/dashboard/rakeen-dashboard.js —
     قسم "ربط واتساب" بإعدادات الإشعارات. */
  html,body{ height:auto; min-height:100%; overflow:visible; display:block; }
  body{ padding:24px; }
  .rk-page{ max-width:520px; margin-inline:auto; }
  button, input{ pointer-events:none; }
</style>

<body>

<div class="rk-page">
  <div class="rk-section" id="waLinkPanel">
    <div class="rk-section-head">
      <div class="rk-section-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
      <div>

      </div>
    </div>
    <button class="rk-btn rk-btn-primary rk-btn-md">إنشاء رمز الربط</button>
    <div style="margin-top:14px;">
      <p class="stock-qty-helper">من جوالك، افتح واتساب وأرسل الرمز التالي لرقم ركين <span class="mono" dir="ltr">+966 55 701 5282</span>:</p>
      <div class="mono" style="font-size:26px; font-weight:800; letter-spacing:4px; text-align:center; padding:14px; margin-top:10px; background:var(--surf1); border-radius:8px; direction:ltr;">4 7 2 9</div>
      <p class="stock-qty-helper" style="margin-top:10px;">بنتحقق تلقائياً أول ما توصلنا رسالتك.</p>
    </div>
  </div>
